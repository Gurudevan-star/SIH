services:

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    environment:
      DATABASE_URL: postgresql://cryptotrace:cryptotrace@postgres:5432/cryptotrace
      CRYPTOTRACE_API_KEY: demo-api-key

    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: cryptotrace
      POSTGRES_PASSWORD: cryptotrace
      POSTGRES_DB: cryptotrace

    ports:
      - "5432:5432"

    volumes:
      - cryptotrace_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U cryptotrace -d cryptotrace"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cryptotrace_data: